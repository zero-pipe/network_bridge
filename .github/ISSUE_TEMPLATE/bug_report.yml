name: Bug report
description: Report a reproducible defect
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove secrets, addresses and payloads you
        cannot share before submitting.
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v0.2.0 or 484da80
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      multiple: true
      options: [udp, tcp, shm, dds, none]
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and compiler
      placeholder: Ubuntu 24.04 / GCC 13, Windows 11 / MSVC 19.40
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Build with ...
        2. Run example 05 ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour and logs
    validations:
      required: true
